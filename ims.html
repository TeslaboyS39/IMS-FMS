<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Inventory - Advanced Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .status-pill { @apply px-2 py-0.5 rounded-full text-[10px] font-bold uppercase; }
        .table-container { overflow-x: auto; scrollbar-width: thin; }
        th, td { white-space: nowrap; }
        /* Style untuk log history */
        .history-item { @apply border-l-2 border-indigo-500 pl-3 py-2 mb-2 bg-gray-50 dark:bg-gray-800/40 rounded-r; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div class="max-w-[98%] mx-auto py-6">
        <div class="bg-white dark:bg-gray-900 p-5 rounded-xl shadow-sm mb-6 flex flex-col lg:flex-row justify-between items-center border dark:border-gray-800">
            <div>
                <h1 class="text-2xl font-black tracking-tight italic">FLEET <span class="text-indigo-600 dark:text-indigo-400">TRACKER</span></h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-mono" id="record-count">Initializing...</p>
            </div>
            
            <div class="flex flex-wrap gap-2 mt-4 lg:mt-0">
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <span id="theme-icon-light" class="hidden text-xl">☀️</span>
                    <span id="theme-icon-dark" class="text-xl">🌙</span>
                </button>
                <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                <button onclick="document.getElementById('importFile').click()" class="bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg text-xs font-bold uppercase">Import JSON</button>
                <button onclick="exportData()" class="bg-gray-800 dark:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase">Export JSON</button>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-xs font-bold shadow-lg uppercase">+ Add Item</button>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-xl border dark:border-gray-800 overflow-hidden">
            <div class="p-4 border-b dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-800/30">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search asset, SN, unit, or notes..." class="border dark:border-gray-700 bg-white dark:bg-gray-800 rounded-lg px-4 py-2 text-xs w-80 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="table-container">
                <table class="w-full text-left text-[11px]" id="inventoryTable">
                    <thead class="bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400 font-bold border-b dark:border-gray-700 uppercase">
                        <tr>
                            <th class="px-4 py-3">No</th>
                            <th class="px-4 py-3">Asset Code</th>
                            <th class="px-4 py-3">Item Name</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3">Assigned Unit</th>
                            <th class="px-4 py-3">Location</th>
                            <th class="px-4 py-3">Set Of</th>
                            <th class="px-4 py-3">Serial/IMEI</th>
                            <th class="px-4 py-3">Last Update</th>
                            <th class="px-4 py-3 sticky right-0 bg-gray-50 dark:bg-gray-800 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-gray-800" id="inventory-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-5xl shadow-2xl max-h-[90vh] overflow-y-auto border dark:border-gray-700">
            <form id="hw-form">
                <div class="p-6 border-b dark:border-gray-800 flex justify-between items-center sticky top-0 bg-white dark:bg-gray-900 z-10">
                    <h3 class="text-lg font-black text-indigo-600 dark:text-indigo-400 uppercase" id="modal-title">Edit Hardware</h3>
                    <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-3xl">&times;</button>
                </div>
                
                <div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="hidden" id="edit-index">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Asset Code</label>
                        <input type="text" id="asset_code" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800 outline-none focus:ring-1 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Item Name</label>
                        <input type="text" id="item_name" list="items" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800">
                        <datalist id="items"><option value="FMC 150"><option value="FMB 150"><option value="SIM Card"><option value="E Can"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Status</label>
                        <select id="status" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800">
                            <option value="On Trial">On Trial</option><option value="On Site">On Site</option>
                            <option value="On Hand">On Hand</option><option value="R&D">R&D</option><option value="Broken">Broken</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Assigned Unit</label>
                        <input type="text" id="assigned_unit" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Serial Number (IMEI)</label>
                        <input type="text" id="serial_number" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Location</label>
                        <input type="text" id="location" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Set Of (Combine Assets - use ; to separate)</label>
                        <input type="text" id="set_of" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800">
                    </div>
                    <div class="md:col-span-4">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Notes</label>
                        <textarea id="notes" rows="2" class="w-full border dark:border-gray-700 rounded p-2 bg-gray-50 dark:bg-gray-800 outline-none"></textarea>
                    </div>
                </div>

                <div class="p-6 border-t dark:border-gray-800 bg-gray-50 dark:bg-gray-800/30 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-6 py-2 text-gray-500 font-bold text-xs">CANCEL</button>
                    <button type="submit" class="bg-indigo-600 text-white px-10 py-2 rounded-lg font-black text-xs shadow-lg uppercase">Update & Log Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="history-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[60]">
        <div class="bg-white dark:bg-gray-900 rounded-2xl w-full max-w-2xl shadow-2xl max-h-[80vh] flex flex-col border dark:border-gray-800">
            <div class="p-5 border-b dark:border-gray-800 flex justify-between items-center">
                <div>
                    <h3 class="font-black text-gray-800 dark:text-gray-100 uppercase">Audit History Log</h3>
                    <p id="history-asset-code" class="text-xs text-indigo-500 font-bold"></p>
                </div>
                <button onclick="closeHistory()" class="text-2xl">&times;</button>
            </div>
            <div id="history-content" class="p-6 overflow-y-auto flex-grow text-sm">
                </div>
        </div>
    </div>

    <script>
        let appData = { metadata: {}, inventory: [] };

        // Core Functions
        window.onload = () => {
            initTheme();
            const saved = localStorage.getItem('fleet_master_v3');
            if (saved) {
                appData = JSON.parse(saved);
                renderTable();
            }
        };

        function renderTable() {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            
            appData.inventory.forEach((item, index) => {
                const lastLog = item.history && item.history.length > 0 ? item.history[item.history.length - 1].date : '-';
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 dark:hover:bg-gray-800/50 transition border-b dark:border-gray-800';
                row.innerHTML = `
                    <td class="px-4 py-3 text-gray-400">${item.no}</td>
                    <td class="px-4 py-3 font-bold text-indigo-600 dark:text-indigo-400">${item.asset_code}</td>
                    <td class="px-4 py-3">${item.item_name}</td>
                    <td class="px-4 py-3"><span class="status-pill ${getStatusColor(item.status)}">${item.status}</span></td>
                    <td class="px-4 py-3 font-medium text-gray-700 dark:text-gray-300">${item.assigned_unit || '-'}</td>
                    <td class="px-4 py-3 text-gray-500">${item.location || '-'}</td>
                    <td class="px-4 py-3 text-[10px] text-gray-400 italic">${Array.isArray(item.set_of) ? item.set_of.join(', ') : '-'}</td>
                    <td class="px-4 py-3 font-mono">${item.serial_number || '-'}</td>
                    <td class="px-4 py-3 text-gray-400 text-[10px]">${lastLog}</td>
                    <td class="px-4 py-3 sticky right-0 bg-white dark:bg-gray-900 border-l dark:border-gray-800 text-center">
                        <button onclick="viewHistory(${index})" class="text-indigo-500 hover:underline font-bold mx-2">History</button>
                        <button onclick="editItem(${index})" class="text-blue-500 hover:underline font-bold mx-2">Edit</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('record-count').innerText = `TOTAL: ${appData.inventory.length} RECORDS | SOURCE: ${appData.metadata.source || 'Manual'}`;
            localStorage.setItem('fleet_master_v3', JSON.stringify(appData));
        }

        // AUTO TRACKING LOGIC
        const form = document.getElementById('hw-form');
        form.onsubmit = (e) => {
            e.preventDefault();
            const idx = document.getElementById('edit-index').value;
            const now = new Date().toLocaleString('id-ID');
            
            const newItem = {
                ...appData.inventory[idx],
                asset_code: document.getElementById('asset_code').value,
                item_name: document.getElementById('item_name').value,
                status: document.getElementById('status').value,
                assigned_unit: document.getElementById('assigned_unit').value,
                serial_number: document.getElementById('serial_number').value,
                location: document.getElementById('location').value,
                set_of: document.getElementById('set_of').value.split(';').map(s => s.trim()).filter(s => s !== ""),
                notes: document.getElementById('notes').value,
                last_modified: new Date().toISOString()
            };

            if (idx !== "") {
                const oldItem = appData.inventory[idx];
                const changes = [];

                // Compare and detect changes
                const fieldsToTrack = ['status', 'assigned_unit', 'location', 'set_of'];
                fieldsToTrack.forEach(field => {
                    const oldVal = JSON.stringify(oldItem[field]);
                    const newVal = JSON.stringify(newItem[field]);
                    if (oldVal !== newVal) {
                        changes.push(`${field.toUpperCase()} changed from [${oldItem[field] || 'EMPTY'}] to [${newItem[field] || 'EMPTY'}]`);
                    }
                });

                if (changes.length > 0) {
                    if (!newItem.history) newItem.history = [];
                    newItem.history.push({
                        date: now,
                        action: "Update Item",
                        details: changes.join(" | ")
                    });
                }
                appData.inventory[idx] = newItem;
            } else {
                // New Item logic
                newItem.no = appData.inventory.length + 1;
                newItem.history = [{ date: now, action: "Created", details: "Initial record added" }];
                appData.inventory.push(newItem);
            }

            closeModal();
            renderTable();
        };

        // UI HELPERS
        function viewHistory(i) {
            const item = appData.inventory[i];
            const content = document.getElementById('history-content');
            document.getElementById('history-asset-code').innerText = `${item.item_name} (${item.asset_code})`;
            
            if (!item.history || item.history.length === 0) {
                content.innerHTML = `<p class="text-gray-400 italic text-center py-10">No history found for this item.</p>`;
            } else {
                content.innerHTML = item.history.slice().reverse().map(h => `
                    <div class="history-item">
                        <div class="flex justify-between text-[10px] font-black text-indigo-500 mb-1">
                            <span>${h.date}</span>
                            <span class="uppercase">${h.action}</span>
                        </div>
                        <p class="text-xs leading-relaxed text-gray-600 dark:text-gray-300">${h.details}</p>
                    </div>
                `).join('');
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function editItem(i) {
            const item = appData.inventory[i];
            document.getElementById('edit-index').value = i;
            document.getElementById('asset_code').value = item.asset_code || '';
            document.getElementById('item_name').value = item.item_name || '';
            document.getElementById('status').value = item.status || 'On Hand';
            document.getElementById('assigned_unit').value = item.assigned_unit || '';
            document.getElementById('serial_number').value = item.serial_number || '';
            document.getElementById('location').value = item.location || '';
            document.getElementById('set_of').value = Array.isArray(item.set_of) ? item.set_of.join('; ') : '';
            document.getElementById('notes').value = item.notes || '';
            document.getElementById('modal-title').innerText = "Update & Trace Asset";
            openModal();
        }

        function getStatusColor(s) {
            if (s === 'On Trial') return 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-500';
            if (s === 'On Site') return 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-400';
            if (s === 'Broken') return 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400';
            return 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400';
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); form.reset(); document.getElementById('edit-index').value = ""; }
        function closeHistory() { document.getElementById('history-modal').classList.add('hidden'); }
        
        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#inventory-body tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            updateIcons(isDark);
        }

        function updateIcons(isDark) {
            document.getElementById('theme-icon-light').classList.toggle('hidden', !isDark);
            document.getElementById('theme-icon-dark').classList.toggle('hidden', isDark);
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateIcons(true);
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], {type : 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'fleet_inventory_audit.json'; a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                appData = JSON.parse(event.target.result);
                renderTable();
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
</html>
